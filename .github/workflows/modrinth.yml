name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example 1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    if: ${{ secrets.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Read the project version
        id: version
        run: echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          JAR="target/hMOTD-${VERSION}.jar"
          test -f "$JAR"

          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          fi

          curl --fail-with-body -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: hMOTD-release-workflow/1.0" \
            -F "file=@${JAR}" \
            -F "name=hMOTD ${VERSION}" \
            -F "version_number=${VERSION}" \
            -F "changelog=${CHANGELOG}" \
            -F "dependencies={\"velocity\":\"3.0.0\"}" \
            -F "game_versions=[\"1.8.8\",\"1.16.5\",\"1.18.2\",\"1.19.4\",\"1.20.4\",\"1.21.4\"]" \
            -F "version_type=release" \
            -F "loaders=[\"velocity\"]" \
            -F "featured=true" \
            -F "project_id=${MODRINTH_PROJECT_ID}" \
            -F "file_parts=[\"file\"]"
