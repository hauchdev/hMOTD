name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v1.1.0'
        required: true
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read the project version
        id: project
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Import GPG key
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build, test and sign
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease clean verify "-Dgpg.skip=${{ secrets.GPG_PRIVATE_KEY == '' }}"

      - name: Verify the plugin descriptor
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          JAR="target/hMOTD-${VERSION}.jar"
          test -f "$JAR"
          rm -rf verify && mkdir verify
          (cd verify && jar xf "../$JAR" velocity-plugin.json)
          grep -q "\"version\": \"${VERSION}\"" verify/velocity-plugin.json
          grep -q '"main": "dev.hauch.hMOTD.HMOTD"' verify/velocity-plugin.json
          diff verify/velocity-plugin.json target/classes/velocity-plugin.json
          rm -rf verify
          echo "Plugin descriptor verified"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/*.jar dist/
          cp target/*.jar.asc dist/ 2>/dev/null || true
          cd dist
          sha256sum *.jar > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          {
            echo "### Installation"
            echo
            echo "1. Download \`hMOTD-${VERSION}.jar\` (the file without \`-sources\` or \`-javadoc\`)."
            echo "2. Copy it into the \`plugins\` folder of your Velocity proxy."
            echo "3. Start the proxy, edit \`plugins/hMOTD/config.yml\` and run \`/hmotd reload\`."
            echo
            echo "### Requirements"
            echo
            echo "* Java 21 or newer"
            echo "* Velocity 3.x"
          } > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk "/^## ${VERSION}\$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: hMOTD ${{ steps.project.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/*.jar
            dist/*.jar.asc
            dist/checksums.txt
          fail_on_unmatched_files: false
