name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hMOTD-jar
          path: target/hMOTD-*.jar
          if-no-files-found: error

  release-profile:
    name: Verify release profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with release profile
        run: mvn -B -Prelease clean package -Dgpg.skip=true

      - name: Verify artifacts
        run: |
          ls -l target/*.jar
          test -f target/hMOTD-*-sources.jar
          test -f target/hMOTD-*-javadoc.jar
