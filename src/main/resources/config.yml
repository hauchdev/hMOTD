# hMOTD Configuration
# A highly optimized Velocity MOTD plugin supporting MiniMessage, legacy '&' codes and hex colors.

# List of MOTDs to display. Supports MiniMessage, legacy '&' codes, and hex colors (#RRGGBB / &#RRGGBB).
# Use \n for multi-line MOTDs.
motds:
  - "<gradient:#00FF00:#0000FF>hMOTD</gradient>\n<white>Optimized MOTD for Velocity"
  - "&aWelcome to &6&lhMOTD &r&7- &eSuper optimized"
  - "<red>Custom MOTD &bwith mixed formats"

# How to pick the MOTD: RANDOM, SEQUENTIAL, DISABLED
rotation-mode: RANDOM

# Text format mode: MINIMESSAGE, LEGACY, MIXED
format-mode: MIXED

# Centering configuration
center:
  # Enable automatic MOTD centering based on Minecraft font widths
  enabled: true
  # Maximum width in pixels used for centering calculations (default Minecraft server list MOTD width)
  width: 248
  # Width of a single space character in pixels (default Minecraft value is 4)
  space-width: 4

# Server icon configuration
icon:
  # Enable custom server icon
  enabled: true
  # Single icon file name inside the plugin directory (must be a 64x64 PNG)
  file: "server-icon.png"
  # List of icon files for rotation (overrides file when not empty)
  files: []
  # Icon rotation mode: RANDOM, SEQUENTIAL, DISABLED
  rotation-mode: RANDOM

# Server info overrides
server-info:
  # Override the version text shown to outdated clients
  override-version: false
  # Version text (supports all formats)
  version-text: "<#FF0000>hMOTD"

  # Override online and max player counts
  override-players: false
  # Fake online player count
  online-players: 0
  # Fake max player count
  max-players: 100

  # Hide online player count
  hide-online: false
  # Hide max player count
  hide-max: false

  # Override player sample (hover text)
  override-sample: false
  # Sample lines shown when hovering the player count
  sample-lines:
    - "&aPowered by hMOTD"
    - "&bSuper optimized"

# Enable placeholder replacement (%online%, %max%, %proxy_name%, %time%, %date%)
placeholders: true

# Custom placeholders available as %key% in MOTDs, version text and sample lines
extra-placeholders:
  server_name: "hMOTD Network"

# Enable debug logging
debug: false
